<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask AI — Chat</title>
<meta name="description" content="Ask a question, get an answer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
<script>
  if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    document.documentElement.classList.add('anim');
  }
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button,input,textarea{font:inherit;color:inherit;background:none;border:0}
  img,svg{display:block}

  :root{
    --bg:#0a0d12;
    --panel:rgba(41,41,43,.955);
    --panel-border:rgba(214,228,255,.14);
    --muted:#8B8C8E;
    --muted-2:#98999C;
    --chip:#909093;
    --white:#ffffff;
    --accent-1:#FBBC94;
    --accent-2:#F49D70;
    --accent-3:#E88654;
    --user-bubble:#1d1d20;
    --font: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:var(--font);
    font-synthesis:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:geometricPrecision;
    overflow:hidden;
  }

  .stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:var(--bg);
  }
  .stage-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  .app{
    position:fixed;
    inset:0;
    z-index:1;
    display:flex;
    flex-direction:column;
    height:100%;
    padding: max(20px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
  }

  /* ---------- header ---------- */
  header.nav{
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 0 clamp(18px, 4vw, 48px);
    height:52px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--white);
  }
  .brand .mark{width:28px;height:28px}
  .brand .word{
    font-size:16px;
    font-weight:500;
    letter-spacing:-0.0154em;
    font-variation-settings:"opsz" 32;
    text-shadow:0 1px 10px rgba(0,0,0,.30);
  }
  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted-2);
    text-shadow:0 1px 10px rgba(0,0,0,.35);
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;
    background:#7FE0A6;
    box-shadow:0 0 8px rgba(127,224,166,.7);
  }

  /* ---------- chat ---------- */
  main.chat{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
    padding: 8px clamp(16px, 4vw, 48px) 0;
  }

  .thread{
    width:100%;
    max-width:760px;
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:18px;
    padding: 10px 4px 24px;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.14) transparent;
  }
  .thread::-webkit-scrollbar{width:6px}
  .thread::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}

  .empty{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    color:var(--muted);
  }
  .empty h1{
    font-size:clamp(22px, 3vw, 30px);
    font-weight:410;
    color:var(--white);
    letter-spacing:0.0018em;
    line-height:1.15;
    font-variation-settings:"opsz" 32;
    text-shadow:0 2px 22px rgba(0,0,0,.35);
  }
  .empty p{
    font-size:14px;
    line-height:1.5;
    max-width:38ch;
    text-shadow:0 1px 12px rgba(0,0,0,.35);
  }

  .msg{
    display:flex;
    gap:12px;
    max-width:100%;
  }
  .msg .avatar{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .msg.user{ justify-content:flex-end; }
  .msg.user .avatar{ order:2; }
  .msg.assistant .avatar{
    background:linear-gradient(163deg,#FBBC94 0%,#F49D70 46%,#E88654 100%);
  }
  .msg.user .avatar{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.14);
  }
  .avatar svg{width:13px;height:13px}

  .bubble{
    font-size:14.5px;
    line-height:1.55;
    letter-spacing:0.005em;
    padding:11px 15px;
    border-radius:16px;
    max-width:min(560px, 78%);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.assistant .bubble{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
    color:#EDEDEE;
    border-top-left-radius:5px;
  }
  .msg.user .bubble{
    background:var(--user-bubble);
    color:#f2f2f3;
    border-top-right-radius:5px;
  }

  .typing{
    display:flex;
    gap:4px;
    align-items:center;
    padding:6px 2px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted-2);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5 }
    30%{ transform:translateY(-4px); opacity:1 }
  }

  /* ---------- composer ---------- */
  .composer-wrap{
    flex:none;
    display:flex;
    justify-content:center;
    padding: 12px clamp(16px, 4vw, 48px) 0;
  }

  form.card{
    position:relative;
    width:100%;
    max-width:760px;
    background:var(--panel);
    backdrop-filter:blur(26px) saturate(112%);
    -webkit-backdrop-filter:blur(26px) saturate(112%);
    box-shadow:
      inset 0 0 0 1px var(--panel-border),
      0 22px 60px rgba(0,0,0,.30);
    border-radius:22px;
    padding: 14px 14px 12px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  textarea.field{
    resize:none;
    width:100%;
    max-height:140px;
    color:#F1F1F2;
    font-size:14.5px;
    line-height:1.4;
    letter-spacing:0.007em;
  }
  textarea.field::placeholder{ color:var(--muted); }

  .tools{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .hint{
    font-size:11.5px;
    color:var(--muted-2);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .hint kbd{
    font-family:inherit;
    font-size:10.5px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    padding:1.5px 5px;
    border-radius:5px;
    color:#c9c9cc;
  }

  .right{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .send{
    width:34px;height:34px;
    border-radius:50%;
    background:linear-gradient(163deg,#FBBC94 0%,#F49D70 46%,#E88654 100%);
    box-shadow:0 3px 12px rgba(210,110,60,.34);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease, opacity .15s ease;
    flex:none;
  }
  .send:hover{ filter:brightness(1.07); }
  .send:active{ transform:scale(.95); }
  .send:disabled{ opacity:.45; cursor:default; filter:none; transform:none; }
  .send svg{width:14px;height:14px}

  :focus-visible{
    outline:2px solid #F8B285;
    outline-offset:3px;
    border-radius:4px;
  }

  /* ---------- entrance motion ---------- */
  :root{
    --e-primary: cubic-bezier(.16,1,.3,1);
    --e-soft:    cubic-bezier(.22,1,.36,1);
  }

  @keyframes e-settle-down{ from{ opacity:0; transform:translateY(-5px);} to{ opacity:1; transform:none;} }
  @keyframes e-settle-up  { from{ opacity:0; transform:translateY(6px);}  to{ opacity:1; transform:none;} }
  @keyframes e-mark       { from{ opacity:0; transform:scale(.9);}       to{ opacity:1; transform:none;} }
  @keyframes e-focus      { from{ opacity:0; transform:translateY(14px); filter:blur(6px);} to{ opacity:1; transform:none; filter:blur(0);} }
  @keyframes e-panel      { from{ opacity:0; transform:translateY(18px) scale(.985);} to{ opacity:1; transform:none;} }
  @keyframes e-populate   { from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }
  @keyframes e-send       { from{ opacity:0; transform:scale(.82);}     to{ opacity:1; transform:none;} }

  html.anim .brand .word,
  html.anim .status{
    opacity:0;
    animation: e-settle-down .58s var(--e-soft) .06s both;
  }
  html.anim .brand .mark{
    opacity:0;
    animation: e-mark .62s var(--e-primary) .06s both;
  }
  html.anim .empty h1{
    opacity:0;
    animation: e-focus 1.0s var(--e-primary) .30s both;
    will-change: transform, opacity, filter;
  }
  html.anim .empty p{
    opacity:0;
    animation: e-settle-up .55s var(--e-soft) .5s both;
  }
  html.anim form.card{
    opacity:0;
    animation: e-panel .90s var(--e-primary) .40s both;
    will-change: transform, opacity;
  }
  html.anim .tools{
    opacity:0;
    animation: e-populate .50s var(--e-soft) .78s both;
  }
  html.anim textarea.field{
    opacity:0;
    animation: e-populate .50s var(--e-soft) .70s both;
  }
  html.anim .send{
    opacity:0;
    animation: e-send .50s var(--e-primary) .86s both;
  }

  @media (prefers-reduced-motion: reduce){
    html.anim *{
      animation-duration: .01ms !important;
      animation-delay: 0s !important;
      transition-duration: .01ms !important;
    }
  }

  @media (max-width:599px){
    header.nav{ padding:0 16px; height:48px; }
    .brand .word{ font-size:15px; }
    .bubble{ max-width:86%; font-size:14px; }
    form.card{ border-radius:18px; padding:12px 12px 10px 15px; }
  }
</style>
</head>
<body>

<div class="stage">
  <video
    class="stage-video"
    autoplay muted loop playsinline
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_124724_bc041163-d651-425f-aea3-2acc1efc2c96.mp4"
  ></video>
</div>

<div class="app">

  <header class="nav">
    <a class="brand" href="#" aria-label="Home">
      <svg class="mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="17" fill="#9C86CE"/>
        <circle cx="17" cy="17" r="8.6" fill="#FFFFFF"/>
        <circle cx="17" cy="17" r="3.7" fill="#151519"/>
      </svg>
      <span class="word">Ask AI</span>
    </a>
    <div class="status"><span class="dot"></span>Online</div>
  </header>

  <main class="chat">
    <div class="thread" id="thread">
      <div class="empty" id="emptyState">
        <h1>Ask me anything.</h1>
        <p>Type a question below and I'll do my best to answer it.</p>
      </div>
    </div>
  </main>

  <div class="composer-wrap">
    <form class="card" id="composerForm">
      <textarea
        class="field"
        id="field"
        rows="1"
        placeholder="Ask a question…"
        aria-label="Message"
      ></textarea>
      <div class="tools">
        <div class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for new line</div>
        <div class="right">
          <button class="send" id="sendBtn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </form>
  </div>

</div>

<script>
(function(){
  // teardown entrance animation once it's done (or after a timeout fallback)
  const sendEl = document.querySelector('.send');
  let teardownDone = false;
  function teardown(){
    if (teardownDone) return;
    teardownDone = true;
    document.documentElement.classList.remove('anim');
  }
  if (sendEl) sendEl.addEventListener('animationend', teardown, { once:true });
  setTimeout(teardown, 1600);

  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('composerForm');
  const field = document.getElementById('field');
  const sendBtn = document.getElementById('sendBtn');

  // auto-grow textarea
  field.addEventListener('input', () => {
    field.style.height = 'auto';
    field.style.height = Math.min(field.scrollHeight, 140) + 'px';
  });

  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function scrollToBottom(){
    thread.scrollTop = thread.scrollHeight;
  }

  function addMessage(role, text){
    if (emptyState) emptyState.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = role === 'assistant'
      ? '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z" fill="white"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" fill="#c9c9cc"/><path d="M5 20c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="#c9c9cc" stroke-width="1.6" stroke-linecap="round"/></svg>';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    thread.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function addTypingIndicator(){
    if (emptyState) emptyState.remove();
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.id = 'typingMsg';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z" fill="white"/></svg>';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    thread.appendChild(msg);
    scrollToBottom();
  }

  function removeTypingIndicator(){
    const t = document.getElementById('typingMsg');
    if (t) t.remove();
  }

  // ---------------------------------------------------------
  // Backend hook: replace the body of this function with a
  // real call to your API, e.g.
  //
  //   const res = await fetch('/api/chat', {
  //     method: 'POST',
  //     headers: { 'Content-Type': 'application/json' },
  //     body: JSON.stringify({ message: userText })
  //   });
  //   const data = await res.json();
  //   return data.reply;
  //
  // It just needs to return (a Promise resolving to) the
  // assistant's reply text.
  // ---------------------------------------------------------
 async function getAIResponse(userText) {
  const response = await fetch("https://chat-bot-kyap.onrender.com/api/chat", {
    method: "POST",
    headers: {       
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: userText
    })
  });

  if (!response.ok) {
    throw new Error("API request failed");
  }

  const data = await response.json();

  return data.reply;
}

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = field.value.trim();
    if (!text) return;

    addMessage('user', text);
    field.value = '';
    field.style.height = 'auto';
    sendBtn.disabled = true;

    addTypingIndicator();
    try {
      const reply = await getAIResponse(text);
      removeTypingIndicator();
      addMessage('assistant', reply);
    } catch (err) {
      removeTypingIndicator();
      addMessage('assistant', "Something went wrong reaching the AI. Please try again.");
    } finally {
      sendBtn.disabled = false;
      field.focus();
    }
  });
})();
</script>

</body>
</html>
